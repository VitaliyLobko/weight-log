<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c111a">
  <meta name="description" content="Щоденна вага, середнє за 7 днів, темп і прогноз досягнення цілі">
  <title>Вага</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('weight-log:theme') || 'auto'; } catch (e) { /* приватний режим */ }
      var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="title">Вага</h1>
      <div class="topbar-actions">
        <button type="button" id="sync-chip" class="sync-chip" hidden></button>
        <a href="#settings" id="settings-btn" class="gear" aria-label="Настройки" data-i18n-aria="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.6 2.3 2.7-.8.6 2.8 2.7.9-.9 2.7 2.3 1.6-2.3 1.6.9 2.7-2.7.9-.6 2.8-2.7-.8L12 21.2l-1.6-2.3-2.7.8-.6-2.8-2.7-.9.9-2.7L3 12l2.3-1.6-.9-2.7 2.7-.9.6-2.8 2.7.8z"/></svg>
        </a>
      </div>
    </div>
    <div id="subtitle" class="muted"></div>
  </header>

  <div id="update" class="update" hidden>
    <span data-i18n="Доступна новая версия">Доступна новая версия</span>
    <button type="button" id="update-btn" data-i18n="Обновить">Обновить</button>
  </div>

  <main id="view" class="view"></main>

  <button type="button" id="fab" class="fab" aria-label="Записать вес" data-i18n-aria="Записать вес">+</button>

  <nav class="tabs">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16.5" rx="4.5"/><path d="M7.6 11.2a4.6 4.6 0 0 1 8.8 0z"/><path class="needle" d="M12 11.2l1.7-2.5"/><path d="M8 16.8h8"/></svg>
      <span data-i18n="Сегодня">Сегодня</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h11.5A1.5 1.5 0 0 1 19 5v14a1.5 1.5 0 0 1-1.5 1.5H6z"/><path d="M6 3.5v17M4.5 7.5h3M4.5 12h3M4.5 16.5h3"/><path class="ln" pathLength="1" d="M10.5 8h5"/><path class="ln" pathLength="1" d="M10.5 12h5"/><path class="ln" pathLength="1" d="M10.5 16h3"/></svg>
      <span data-i18n="Журнал">Журнал</span>
    </a>
    <a href="#chart" data-tab="chart">
      <svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><path class="line" pathLength="1" d="M7.5 14.5l3.5-4 3 2.5 5-6"/><circle cx="19" cy="7" r="1.3" class="fill dot"/></svg>
      <span data-i18n="График">График</span>
    </a>
    <a href="#ration" data-tab="ration">
      <svg viewBox="0 0 24 24"><path class="fork" d="M7 3.5v17M4.5 3.5v4.5a2.5 2.5 0 0 0 5 0V3.5"/><path class="knife" d="M17 20.5V3.5c-2.2 1-3.5 3.6-3.5 7v3h3.5"/></svg>
      <span data-i18n="Рацион">Рацион</span>
    </a>
  </nav>

  <div id="layer"></div>
</body>
</html>
