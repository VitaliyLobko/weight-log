<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1316">
  <meta name="description" content="Щоденна вага, середнє за 7 днів, темп і прогноз досягнення цілі">
  <title>Вага</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('weight-log:theme') || 'auto'; } catch (e) { /* приватний режим */ }
      var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="title">Вага</h1>
      <div class="topbar-actions">
        <button type="button" id="sync-chip" class="sync-chip" hidden></button>
        <a href="#settings" id="settings-btn" class="gear" aria-label="Настройки" data-i18n-aria="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.6 2.3 2.7-.8.6 2.8 2.7.9-.9 2.7 2.3 1.6-2.3 1.6.9 2.7-2.7.9-.6 2.8-2.7-.8L12 21.2l-1.6-2.3-2.7.8-.6-2.8-2.7-.9.9-2.7L3 12l2.3-1.6-.9-2.7 2.7-.9.6-2.8 2.7.8z"/></svg>
        </a>
      </div>
    </div>
    <div id="subtitle" class="muted"></div>
  </header>

  <div id="update" class="update" hidden>
    <span data-i18n="Доступна новая версия">Доступна новая версия</span>
    <button type="button" id="update-btn" data-i18n="Обновить">Обновить</button>
  </div>

  <main id="view" class="view"></main>

  <button type="button" id="fab" class="fab" aria-label="Записать вес" data-i18n-aria="Записать вес">+</button>

  <nav class="tabs">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 7.5A3.5 3.5 0 0 1 7.5 4h9A3.5 3.5 0 0 1 20 7.5v9a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5z"/><path d="M8 10.5a5 5 0 0 1 8 0"/><path d="M12 10.8l1.6-2.3"/></svg>
      <span data-i18n="Сегодня">Сегодня</span>
    </a>
    <a href="#chart" data-tab="chart">
      <svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M7 9l4 3 3-2 5 5"/></svg>
      <span data-i18n="График">График</span>
    </a>
    <a href="#log" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span data-i18n="Журнал">Журнал</span>
    </a>
  </nav>

  <div id="layer"></div>
</body>
</html>
